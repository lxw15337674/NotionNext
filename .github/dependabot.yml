# 依赖更新 PR 由机器人提交，维护者每周批量 Review 即可
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    labels:
      - dependencies
    commit-message:
      prefix: chore
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # 站点保留了 vitepress-chat@0.0.3 的运行时补丁；升级前必须先重建补丁，
      # 否则 postinstall 的 patch-package 会让所有 CI 安装阶段失败。
      - dependency-name: vitepress-chat

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
